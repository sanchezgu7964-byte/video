# 《野草》題辭 —— 時間軸、字幕、配色設定。
# 改時長或對位點只需改這裡；所有秒數都是片頭起算。

[output]
width = 1920
height = 1080
fps = 30
duration = 208.53          # 最後 3 秒土色在無聲中停留
seed = 1927

# ── 脈搏 ─────────────────────────────────────────────────────
# 全片的節拍由這裡產生；聲音與畫面都從同一份時間軸生成，所以一定對齊。
# 錨點放在熔岩噴出那一拍，往前往後等距展開。
[pulse]
bpm = 66.26
anchor = 123.32

# ── 聲音 ─────────────────────────────────────────────────────
[sound]
sample_rate = 48000
master_db = -1.0          # 最終峰值正規化
reverb_seconds = 3.2
[fonts]
serif = "fonts/serif_light"     # 字幕（宋體系，偏細）
grass = "fonts/serif_regular"   # 字草：同一字體家族，稍粗以便彎折
sans = "fonts/sans_medium"      # 口號網格（黑體）

# ── 關鍵時間點（畫面與聲音共用） ─────────────────────────────
[cues]
crack_hairline = 13.5    # 「我將開口」：中央出現髮絲般的裂縫
crack = 22.70            # 屏息之後：裂縫打開，微粒洩出
leaf_in = 25.0
decay = 29.0             # 「朽腐」：碎片長出黴絲
mud_hang = 35.0
mud_drop = 40.6
mud_land = 42.0          # 泥砸在地平線上
tree_peak = 44.4
tree_collapse = 45.8
grass_rise = 47.0
blood = 50.0
names_start = 53.0
names_end = 60.5
stomp_start = 62.4       # 踐踏與刪刈開始（卡拍）
stomp_halfbeat = 70.0    # 1:10 後加密成半拍
breath = 81.0            # 1:21 呼吸
sing = 87.5              # 「大笑」「歌唱」：擺動變成節奏
selflove = 95.0          # 「自愛」：暖光停 4 秒
zoom_start = 99.0
zoom_end = 106.0
grid_in = 100.5
grid_absorb = 104.0
fire_rise = 112.98       # 1:53 光從底下透出
dim = 121.0              # 2:01 一切暗一下
erupt = 123.32           # 2:03 熔岩噴出
freeze = 140.0           # 2:20 「無可朽腐」
hush = 150.0             # 2:30 靜穆
restore = 157.73         # 2:38 「天地即不如此靜穆」（拍點）
witness = 162.0          # 2:42 作證
cycle = 172.0            # 2:52 火速
stop = 181.27            # 3:01 驟停（拍點）
farewell = 188.0         # 3:08 去罷
colophon = 198.0         # 3:18 落款
earth = 199.0
silence = 205.53         # 之後完全無聲

# ── 配色 ───────────────────────────────────────────────────
[palette]
void = "#0b0a09"
ash_gray = "#3a3835"
cold_gray = "#2c3034"
warm_gray = "#3a332b"
soil = "#2a2119"
soil_deep = "#15100c"
mud = "#3b2a1c"
grass = "#87927a"        # 灰綠
grass_dim = "#59604f"
blood = "#6e1712"        # 地底暗紅
lava = "#ff6a1a"         # 熔岩橙（只在第 4、7 段）
ember = "#ffb36b"
grid = "#6b6a63"
subtitle = "#ddd3c3"
light_warm = "#f0c98a"
earth = "#6b5641"        # 結尾溫暖土色

# ── 角落年份（只在第 11 段，透明度約 20%） ─────────────────────
[years]
list = [1911, 1913, 1915, 1917, 1919, 1926, 1927]
alpha = 0.2

# ── 第 4 段地底名字層 ─────────────────────────────────────────
# 待定：名字留空時只畫無法辨認的筆跡；若要用真名，填入下列陣列。
[names]
list = []
alpha = 0.22

# ── 口號網格 ─────────────────────────────────────────────────
[grid]
text = "覺醒進步光明前途新生革命"

# ── 手的痕跡 ─────────────────────────────────────────────────
[tremble]
every = 12.5
duration = 0.45
amplitude = 1.6

# ── 字幕 ─────────────────────────────────────────────────────
# mode = "type"：一字一字浮現；"carve"：像銘文一樣一次刻出
# until 省略時，到下一行開始時淡出。
[subtitle]
size = 38
char_interval = 0.085
char_fade = 0.55
baseline = 975
max_chars = 26

[[line]]
at = 3.5
text = "當我沉默著的時候，我覺得充實；"
[[line]]
at = 13.5
text = "我將開口，同時感到空虛。"
until = 22.4

[[line]]
at = 24.2
text = "過去的生命已經死亡。"
[[line]]
at = 26.0
text = "我對於這死亡有大歡喜，因為我借此知道它曾經存活。"
[[line]]
at = 29.0
text = "死亡的生命已經朽腐。"
[[line]]
at = 31.0
text = "我對於這朽腐有大歡喜，因為我借此知道它還非空虛。"

[[line]]
at = 35.3
text = "生命的泥委棄在地面上，不生喬木，只生野草，"
[[line]]
at = 39.3
text = "這是我的罪過。"
until = 42.0

[[line]]
at = 44.6
text = "野草，根本不深，花葉不美，"
[[line]]
at = 50.0
text = "然而吸取露，吸取水，吸取陳死人的血和肉，"
[[line]]
at = 56.5
text = "各各奪取它的生存。"
[[line]]
at = 62.4
text = "當生存時，還是將遭踐踏，將遭刪刈，"
[[line]]
at = 72.0
text = "直至於死亡而朽腐。"
until = 80.4

[[line]]
at = 82.4
text = "但我坦然，欣然。"
[[line]]
at = 87.5
text = "我將大笑，我將歌唱。"
until = 93.6

[[line]]
at = 95.0
text = "我自愛我的野草，"
[[line]]
at = 101.5
text = "但我憎惡這以野草作裝飾的地面。"
until = 112.4

[[line]]
at = 113.4
text = "地火在地下運行，奔突；"
until = 120.8
[[line]]
at = 123.32
text = "熔岩一旦噴出，"
[[line]]
at = 128.0
text = "將燒盡一切野草，以及喬木，"
[[line]]
at = 137.0
text = "於是並且無可朽腐。"
until = 143.4

[[line]]
at = 144.3
text = "但我坦然，欣然。"
[[line]]
at = 146.8
text = "我將大笑，我將歌唱。"
until = 149.8

[[line]]
at = 150.6
text = "天地有如此靜穆，我不能大笑而且歌唱。"
[[line]]
at = 157.73
text = "天地即不如此靜穆，我或者也將不能。"
until = 161.6

[[line]]
at = 162.3
mode = "carve"
text = "我以這一叢野草，在明與暗，生與死，過去與未來之際，獻於友與仇，人與獸，愛者與不愛者之前作證。"
until = 171.7

[[line]]
at = 172.4
text = "為我自己，為友與仇，人與獸，愛者與不愛者，"
[[line]]
at = 176.6
text = "我希望這野草的朽腐，火速到來。"
until = 181.27
fade_out = 0.0
[[line]]
at = 182.1
text = "要不然，我先就未曾生存，這實在比死亡與朽腐更其不幸。"
until = 187.4

[[line]]
at = 189.0
text = "去罷，野草，連著我的題辭！"
until = 197.0

[[line]]
at = 198.0
mode = "colophon"
text = "一九二七年四月二十六日　魯迅記于廣州之白雲樓上"
until = 204.0
fade_out = 2.5
