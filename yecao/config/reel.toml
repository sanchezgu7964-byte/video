# 試片：四個關鍵場景（鐵屋、看客、街頭標語、傳單與字草），確認方向用，不是全片。
# 每個鏡頭：plate = 刻版名稱（ycf/plates.py）、p = 播出這張版自己的哪一段進度、
# view / to = 取景的起訖（放大倍數, 中心 x, 中心 y），dur = 秒。
# kind = "black" 是黑；vignette = 字草世界的一段（ycf/vignettes.py），tau = 播出的時間區段。
# 原則：重要的人、物、動作先停留，讓觀眾看清楚，再剪。

