# 《野草》題辭 —— 剪輯（分鏡）
#
# view = [放大倍數, 中心 x, 中心 y]，座標是全景（1920×1080）畫面上的位置；省略即全景。
# to   = 鏡頭結束時的取景（推、拉、搖）。
# kind = scene（預設）/ black / white / flash；寫了 insert = "名稱" 就是一個意象鏡頭（木刻版畫）。
# p    = 意象的進度：[開始, 結束] 在鏡頭內播完，或單一數字＝定格在那一刻。
# mute = true：這個鏡頭連聲音也切掉。tick = true：剪接點上一聲極短的切音（意象鏡頭預設有）。
# 每個鏡頭一直持續到下一個鏡頭開始。[[burst]] 依場景資料生成鏡頭串，區間內的明確鏡頭會被取代。
#
# 意象（ycf/inserts.py）：
#   iron_house 鐵屋子與熟睡的人／mouth 張開而空的嘴／candle 熄滅的燭／grass_crack 石縫裡鑽出的草
#   roots_bones 穿過骨頭吸血的根／boots 行進的靴／onlookers 伸長脖子的看客
#   crowd（surge 人潮與紅旗／formation 一模一樣的方陣／empty 散場後的廣場）
#   gate 坍塌的節烈牌坊／calendar 撕下的日曆／bars 牢窗／lamp_window 白雲樓上夜裡的燈

# 閃回用的畫面：渲染前先在這些時刻各拍一張全景（out/cache/recall_NN.png）
