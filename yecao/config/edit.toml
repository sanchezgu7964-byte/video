# 《野草》題辭 —— 剪輯（分鏡）
#
# view = [放大倍數, 中心 x, 中心 y]，座標是全景（1920×1080）畫面上的位置；省略即全景。
# to   = 鏡頭結束時的取景（推、拉、搖）。
# kind = scene（預設）/ black / white / flash
# mute = true：這個鏡頭連聲音也切掉。tick = true：剪接點上一聲極短的切音。
# 每個鏡頭一直持續到下一個鏡頭開始。[[burst]] 依場景資料自動生成一串鏡頭，區間內的明確鏡頭會被取代。

